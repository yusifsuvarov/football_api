name: Azure OIDC Blob test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  upload-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Azure SDK
        run: pip install azure-identity azure-storage-blob

      - name: Upload test JSON with Python SDK
        env:
          PYTHONPATH: src
          AZURE_STORAGE_ENABLED: "true"
          AZURE_STORAGE_ACCOUNT_URL: https://stfootballapidev.blob.core.windows.net
          AZURE_STORAGE_CONTAINER: raw-football-data
          AZURE_STORAGE_AUTH_MODE: default_azure_credential
        run: |
          python - <<'PY'
          from datetime import date, datetime, timezone
          from football_pipeline.storage.raw_json import save_raw_payload

          payload = {"test": "Python SDK with GitHub OIDC", "status": "success"}
          save_raw_payload(payload, date.today(), datetime.now(timezone.utc))
          PY