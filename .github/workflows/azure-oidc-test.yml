name: Azure OIDC Blob test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  upload-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Azure SDK
        run: pip install azure-identity azure-storage-blob

      - name: Fetch Football API data and upload raw JSON to Azure
        env:
          PYTHONPATH: src
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          AZURE_STORAGE_ENABLED: "true"
          AZURE_STORAGE_ACCOUNT_URL: https://stfootballapidev.blob.core.windows.net
          AZURE_STORAGE_CONTAINER: raw-football-data
          AZURE_STORAGE_AUTH_MODE: default_azure_credential
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from football_pipeline.jobs.fixtures_ingestion import fetch_and_save_raw

          today_baku = datetime.now(ZoneInfo("Asia/Baku")).date()
          fixture_dates = [
              today_baku - timedelta(days=1),
              today_baku,
              today_baku + timedelta(days=1),
          ]

          saved = fetch_and_save_raw(fixture_dates)
          print(f"Saved {len(saved)} raw API payloads:")
          for item in saved:
              print(f"{item['fixture_date']} -> {item['path']}")
          PY