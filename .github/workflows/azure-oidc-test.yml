name: Azure OIDC Blob test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  upload-test:
    runs-on: ubuntu-latest

    steps:
      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create test file
        run: |
          echo '{"test":"GitHub Actions OIDC upload","status":"success"}' > oidc-check.json

      - name: Upload test file to Blob Storage
        run: |
          az storage blob upload \
            --account-name stfootballapidev \
            --container-name raw-football-data \
            --name github-actions/oidc-check.json \
            --file oidc-check.json \
            --auth-mode login \
            --overwrite true