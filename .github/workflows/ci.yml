name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-python:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q dags src

      - name: Install test dependencies
        run: python -m pip install pytest requests "psycopg[binary]" ruff==0.17.0

      - name: Run Ruff lint
        run: ruff check dags src tests

      - name: Check Python formatting
        run: ruff format --check dags src tests

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m pytest tests -q